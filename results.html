<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Results — Mission: Found</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');
  :root {
    --cream: #F4EFE6; --navy-deep: #060A16; --blue: #5B7FE0; --muted: #9AA6C4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Space Grotesk', sans-serif; background: var(--navy-deep);
    min-height: 100vh; display: flex; flex-direction: column; padding: 56px 72px;
  }
  nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0; }
  .logo-mark { display: flex; flex-direction: column; line-height: 0.9; font-family: 'JetBrains Mono', monospace; text-decoration: none; }
  .logo-mark .line1 { font-weight: 600; font-size: 22px; letter-spacing: 0.02em; color: var(--cream); }
  .logo-mark .line2 { font-weight: 600; font-size: 22px; letter-spacing: 0.06em; color: transparent; -webkit-text-stroke: 1.2px var(--blue); margin-left: 2px; }
  .back {
    color: var(--muted); text-decoration: none; font-family: 'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase;
    border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; padding: 10px 18px;
  }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  h1 { color: var(--cream); font-size: 42px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 16px; }
  p { color: var(--muted); font-size: 17px; max-width: 480px; line-height: 1.6; }
  @media (max-width: 640px) { body { padding: 24px 20px; } h1 { font-size: 30px; } }
</style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo-mark"><span class="line1">MISSION:</span><span class="line2">FOUND</span></a>
    <a href="index.html" class="back">← Back home</a>
  </nav>
  <main>
    <h1>Results</h1>
    <p>This page is coming soon. Check back shortly for a real before-and-after results from our pilot clients, including 603 Snow &amp; Ice.</p>
  </main>
</body>
</html>
