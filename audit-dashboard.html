<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Visibility Score — Mission: Found</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');

  :root {
    --cream: #F4EFE6; --navy: #0E1730; --navy-deep: #060A16;
    --blue: #5B7FE0; --muted: #B3C0DE; --card: #10192F;
    --red: #EF7F7F; --amber: #E8B85B; --green: #6FCF97;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Space Grotesk', sans-serif; background: var(--navy-deep);
    color: var(--cream); padding: 40px 24px 80px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }

  header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 36px; flex-wrap: wrap; gap: 20px; }
  .logo { display: flex; flex-direction: row; align-items: baseline; gap: 0.3em; line-height: 0.9; font-family: 'JetBrains Mono', monospace; }
  .logo .l1 { font-weight: 600; font-size: 20px; letter-spacing: 0.02em; color: var(--cream); }
  .logo .l2 { font-weight: 600; font-size: 20px; letter-spacing: 0.06em; color: var(--blue); }

  #printDoc { display: none; }

  /* ===== Print Document (built fresh at print time, decoupled from screen UI) ===== */
  .pd-page {
    background: #fff; color: #1A1A1A; font-family: 'Space Grotesk', sans-serif;
    page-break-after: always; padding: 8px 4px;
  }
  .pd-page:last-child { page-break-after: auto; }

  /* Cover page */
  .pd-cover {
    display: flex; flex-direction: column; justify-content: space-between;
    min-height: 9.2in; text-align: center;
  }
  .pd-cover-top { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .pd-cover-logo { width: 44px; height: 44px; border-radius: 10px; }
  .pd-cover-brand { font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #555; }
  .pd-cover-mid { display: flex; flex-direction: column; gap: 14px; }
  .pd-cover-eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.06em;
    text-transform: uppercase; color: #888;
  }
  .pd-cover-client { font-size: 42px; font-weight: 700; letter-spacing: -0.01em; color: #0E1730; }
  .pd-cover-date { font-size: 15px; color: #666; }
  .pd-cover-bottom { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .pd-cover-score {
    font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; color: #0E1730;
    border-top: 1px solid #DDD; padding-top: 16px; width: 260px;
  }
  .pd-cover-footer { font-size: 10.5px; color: #999; }

  /* Executive summary + pillar pages */
  .pd-section-header {
    font-size: 26px; font-weight: 700; color: #0E1730; margin-bottom: 20px;
    border-bottom: 2px solid #0E1730; padding-bottom: 10px;
  }
  .pd-score-block { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; }
  .pd-score-num { font-size: 48px; font-weight: 700; color: #0E1730; }
  .pd-score-max { font-size: 20px; color: #999; font-weight: 500; }
  .pd-score-label { font-size: 16px; font-weight: 700; }
  .pd-methodology { font-size: 12px; color: #666; line-height: 1.6; margin: 16px 0 28px; max-width: 6.6in; }

  .pd-table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
  .pd-table th {
    text-align: left; font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
    letter-spacing: 0.04em; text-transform: uppercase; color: #888;
    border-bottom: 2px solid #0E1730; padding: 0 10px 10px 0;
  }
  .pd-table td { padding: 12px 10px 12px 0; border-bottom: 1px solid #E5E5E5; font-size: 13.5px; vertical-align: top; }
  .pd-table tr:last-child td { border-bottom: none; }
  .pd-th-center, .pd-td-center { text-align: center; }
  .pd-td-name { font-weight: 600; }
  .pd-td-contrib { color: #3355B0; font-family: 'JetBrains Mono', monospace; font-weight: 600; }

  .pd-subhead { font-size: 18px; font-weight: 700; color: #0E1730; margin-bottom: 4px; }
  .pd-priority-sub { font-size: 12px; color: #888; margin-bottom: 16px; }
  .pd-priority-item {
    display: flex; align-items: flex-start; gap: 14px; padding: 12px 0; border-bottom: 1px solid #E5E5E5;
  }
  .pd-priority-item:last-child { border-bottom: none; }
  .pd-priority-rank {
    width: 22px; height: 22px; border-radius: 50%; background: #FBE7E7; color: #B23B3B;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .pd-priority-text { flex: 1; }
  .pd-priority-name { font-size: 13.5px; font-weight: 600; }
  .pd-priority-pillar { font-size: 11px; color: #888; font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
  .pd-priority-gap { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #3355B0; font-weight: 600; }
  .pd-empty { font-size: 13px; color: #888; }

  .pd-pillar-header {
    background: #F5F5F5; border-radius: 10px; padding: 16px 20px; margin-bottom: 22px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .pd-pillar-title { font-size: 20px; font-weight: 700; color: #0E1730; }
  .pd-pillar-meta { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #666; }
  .pd-td-crit { max-width: 5in; }
  .pd-crit-name { font-weight: 600; font-size: 13.5px; }
  .pd-crit-note { font-size: 11.5px; color: #888; margin-top: 3px; }
  .pd-badge {
    display: inline-block; padding: 5px 16px; border-radius: 999px; font-weight: 700; font-size: 12px;
  }
  .pd-badge-pass { color: #1F7A45; background: #E6F5EC; }
  .pd-badge-fail { color: #B23B3B; background: #FBE7E7; }
  .pd-badge-na { color: #6B7280; background: #EDEEF0; }

  .tool-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

  .meta-inputs { display: flex; gap: 20px; flex-wrap: wrap; }
  .meta-field label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .meta-field input {
    background: var(--card); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
    padding: 11px 14px; color: var(--cream); font-family: 'Space Grotesk', sans-serif; font-size: 14px; outline: none;
    width: 220px;
  }
  #auditDate { width: 170px; }
  .meta-field input:focus { border-color: var(--blue); }

  .score-panel {
    display: grid; grid-template-columns: 280px 1fr; gap: 32px; align-items: center;
    background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px;
    padding: 36px; margin-bottom: 40px;
  }
  .gauge-wrap { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .gauge-svg-wrap { position: relative; width: 260px; height: 150px; }
  .gauge-svg-wrap svg { display: block; }
  .gauge-num {
    position: absolute; left: 0; right: 0; bottom: 4px; text-align: center;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px;
  }
  .gauge-num .big { font-size: 44px; display: block; line-height: 1; }
  .gauge-num .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 6px; display: block; }

  .breakdown h2 { font-size: 13px; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 20px; font-weight: 600; }
  .pillar-row { display: grid; grid-template-columns: 190px 1fr 60px 50px; align-items: center; gap: 14px; margin-bottom: 14px; }
  .pillar-row .pname { font-size: 13.5px; font-weight: 600; }
  .pillar-row .pweight { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); }
  .bar-track { height: 8px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width 0.25s ease, background 0.25s ease; }
  .pscore { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; text-align: right; }
  .pcontrib { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--muted); text-align: right; }

  .pillar-card {
    background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px;
    margin-bottom: 20px; overflow: hidden;
  }
  .pillar-card-header {
    display: flex; justify-content: space-between; align-items: center; padding: 20px 26px;
    cursor: pointer; user-select: none;
  }
  .pillar-card-header .title-block { display: flex; align-items: center; gap: 14px; }
  .pillar-card-header h3 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .pillar-card-header .weight-tag {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.04em;
    color: var(--blue); border: 1px solid var(--blue); border-radius: 999px; padding: 3px 10px;
  }
  .pillar-card-header .subtotal { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; color: var(--muted); }
  .chevron { transition: transform 0.2s; color: var(--muted); }
  .pillar-card.open .chevron { transform: rotate(180deg); }

  .criteria-list { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
  .criteria-list-inner { padding: 6px 26px 24px; display: flex; flex-direction: column; }
  .criterion {
    display: grid; grid-template-columns: 1fr 120px 70px; align-items: center; gap: 16px;
    padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .criterion:first-child { padding-top: 0; }
  .criterion:last-child { padding-bottom: 0; border-bottom: none; }
  .criterion .cname { font-size: 15px; font-weight: 500; color: var(--cream); line-height: 1.4; }
  .criterion .cnote { display: block; font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .criterion input[type=range] {
    -webkit-appearance: none; width: 100%; height: 6px; border-radius: 999px;
    background: rgba(255,255,255,0.1); outline: none;
  }
  .criterion input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--blue); cursor: pointer; border: 2px solid var(--cream);
  }
  .criterion .cval { display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
  .criterion .cval input[type=number] {
    width: 34px; background: transparent; border: 1px solid transparent; border-radius: 6px;
    padding: 4px 2px; color: var(--cream); font-family: 'JetBrains Mono', monospace; font-size: 13px;
    font-weight: 600; text-align: center; outline: none; transition: border-color 0.15s, background 0.15s;
    -moz-appearance: textfield;
  }
  .criterion .cval input[type=number]::-webkit-outer-spin-button,
  .criterion .cval input[type=number]::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .criterion .cval input[type=number]:hover { background: rgba(255,255,255,0.05); }
  .criterion .cval input[type=number]:focus { border-color: var(--blue); background: var(--navy); }
  .criterion .cval .max { color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }

  .criterion.binary { grid-template-columns: 1fr auto auto; align-items: center; gap: 16px; }
  .toggle-group {
    display: flex; gap: 6px; flex-shrink: 0;
  }
  .toggle-btn {
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.15); border-radius: 999px;
    color: var(--muted); cursor: pointer;
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 12px;
    padding: 8px 0; width: 54px; text-align: center; transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .toggle-btn:hover:not(.active) { border-color: rgba(255,255,255,0.35); color: var(--cream); }
  .toggle-btn.is-fail.active { background: rgba(239,127,127,0.18); border-color: rgba(239,127,127,0.55); color: #EF7F7F; }
  .toggle-btn.is-pass.active { background: rgba(111,207,151,0.18); border-color: rgba(111,207,151,0.55); color: #6FCF97; }
  .toggle-btn.is-na.active { background: rgba(179,192,222,0.16); border-color: rgba(179,192,222,0.5); color: var(--muted); }
  .criterion-points {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted);
    width: 52px; text-align: right; flex-shrink: 0;
  }

  .interp-legend { display: flex; gap: 14px 18px; flex-wrap: wrap; justify-content: center; margin-top: 14px; max-width: 260px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); }
  .interp-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .interp-legend .dot { width: 8px; height: 8px; border-radius: 50%; }

  .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .print-btn, .action-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13.5px;
    padding: 12px 20px; border-radius: 999px; cursor: pointer; line-height: 1;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .print-btn {
    background: transparent; color: var(--cream); border: 1px solid rgba(255,255,255,0.18);
  }
  .print-btn:hover { border-color: var(--blue); }
  .action-btn {
    background: transparent; color: var(--cream); border: 1px solid rgba(255,255,255,0.18);
  }
  .action-btn:hover { border-color: var(--blue); }
  .print-btn .icon, .action-btn .icon { font-size: 15px; display: inline-flex; }
  #loadFileInput { display: none; }

  .compare-strip {
    display: none; align-items: center; justify-content: center; gap: 16px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted);
    margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08);
  }
  .compare-strip.show { display: flex; flex-wrap: wrap; }
  .compare-strip .delta-up { color: #6FCF97; font-weight: 700; }
  .compare-strip .delta-down { color: #EF7F7F; font-weight: 700; }
  .compare-strip .delta-flat { color: var(--muted); font-weight: 700; }

  .priority-panel {
    background: #10192F; border: 1px solid rgba(239,127,127,0.3); border-radius: 20px;
    padding: 30px 32px; margin-bottom: 24px;
  }
  .priority-panel h2 {
    font-family: 'Space Grotesk', sans-serif; font-size: 20px; letter-spacing: -0.01em;
    color: var(--cream); margin-bottom: 6px; font-weight: 700;
  }
  .priority-panel h2 .warn-icon { color: #EF7F7F; }
  .priority-panel .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; line-height: 1.5; }
  .priority-item {
    display: flex; align-items: flex-start; gap: 16px; padding: 14px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .priority-item:last-child { border-bottom: none; }
  .priority-rank {
    width: 26px; height: 26px; border-radius: 50%; background: rgba(239,127,127,0.15);
    color: #EF7F7F; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12.5px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
  }
  .priority-item .ptext { flex: 1; }
  .priority-item .pname { color: var(--cream); font-size: 15.5px; font-weight: 600; line-height: 1.4; }
  .priority-item .ppillar { color: var(--muted); font-size: 12px; font-family: 'JetBrains Mono', monospace; margin-top: 3px; }
  .priority-item .pgap {
    font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--blue); font-weight: 600;
    white-space: nowrap; flex-shrink: 0; margin-top: 3px;
  }
  .priority-empty { color: var(--muted); font-size: 14px; padding: 8px 0; }

  @page { margin: 0.75in; }

  @media print {
    body { background: white; }
    .wrap > *:not(#printDoc) { display: none !important; }
    #printDoc { display: block !important; }
  }

  @media (max-width: 760px) {
    .score-panel { grid-template-columns: 1fr; text-align: center; }
    .pillar-row { grid-template-columns: 1fr; text-align: left; gap: 6px; }
    .pillar-row .bar-track { grid-column: 1 / -1; }
    .criterion { grid-template-columns: 1fr; gap: 8px; }
    .criterion.binary { grid-template-columns: 1fr; }
    .criterion.binary .toggle-group { align-self: flex-start; }
    .criterion.binary .criterion-points { display: none; }
    .btn-group { justify-content: center; }
    .print-btn, .action-btn { font-size: 12.5px; padding: 11px 16px; }
    .meta-field input { width: 100%; }
    #auditDate { width: 100%; }
  }
</style>
</head>

          <path id="gaugeArc" d="M 20 140 A 110 110 0 0 1 240 140" fill="none" stroke="#EF7F7F" stroke-width="20" stroke-linecap="round" stroke-dasharray="345.6" stroke-dashoffset="345.6"/>
        </svg>
        <div class="gauge-num">
          <span class="big" id="compositeScore">0.0</span>
          <span class="label" id="interpLabel">Critical</span>
        </div>
      </div>
      <div class="interp-legend">
        <span><span class="dot" style="background:#EF7F7F"></span>0–40 Critical</span>
        <span><span class="dot" style="background:#E8B85B"></span>41–60 Needs Work</span>
        <span><span class="dot" style="background:#5B7FE0"></span>61–80 Solid</span>
        <span><span class="dot" style="background:#6FCF97"></span>81–100 Excellent</span>
      </div>
    </div>
    <div class="breakdown">
      <h2>Pillar Breakdown</h2>
      <div id="pillarRows"></div>
      <div class="btn-group">
        <button class="print-btn" onclick="window.print()"><span class="icon">🖨</span> Print / Save as PDF</button>
        <button class="action-btn" onclick="saveAudit()"><span class="icon">💾</span> Save Audit</button>
        <button class="action-btn" onclick="document.getElementById('loadFileInput').click()"><span class="icon">📂</span> Load Audit</button>
        <input type="file" id="loadFileInput" accept="application/json" onchange="loadAudit(event)">
      </div>
      <div class="compare-strip" id="compareStrip"></div>
    </div>
  </div>

  <div class="priority-panel">
    <h2><span class="warn-icon">⚠</span> Top Priorities</h2>
    <div class="sub">Auto-generated from your lowest-scoring criteria, ranked by point opportunity — fix these first.</div>
    <div id="priorityList"></div>
  </div>

  <div id="pillarCards"></div>

  <div id="printDoc"></div>

</div>

<script>
const PILLARS = [
  {
    key: 'gbp', name: 'Google Business Profile Optimization', weight: 0.35, color: '#5B7FE0',
    criteria: [
      ['Business info accuracy (name/address/phone)', 20, 'Exact match across GBP and every listing', 'binary'],
      ['Primary + secondary categories', 10, 'Pass: primary category is most specific option + secondaries filled', 'binary'],
      ['Business description quality', 10, 'Pass: present, keyword-relevant, uses full character limit', 'binary'],
      ['Hours of operation accuracy', 5, 'Pass: accurate, includes holiday hours if applicable', 'binary'],
      ['Services/products list completeness', 10, 'Pass: complete, specific list, not just category defaults', 'binary'],
      ['Service area configuration', 5, 'If the business travels to customers', 'binary'],
      ['Attributes completed', 5, 'Pass: relevant attributes filled (accessibility, payment, etc.)', 'binary'],
      ['Photos — quantity & recency', 15, 'Pass: 10+ photos, 3+ added in last 90 days', 'binary'],
      ['Google Posts activity', 10, 'Pass: 2+ posts in last 30 days', 'binary'],
      ['Q&A monitored', 5, 'No unanswered questions older than 7 days', 'binary'],
      ['Messaging/booking enabled', 5, 'If supported for business type', 'binary'],
    ]
  },
  {
    key: 'reviews', name: 'Reviews & Reputation', weight: 0.25, color: '#E8B85B',
    criteria: [
      ['Review count vs. competitor average', 20, 'Pass: at or above the 3-5 benchmarked competitors\' average', 'binary'],
      ['Average star rating', 20, 'Pass: 4.3 stars or higher', 'binary'],
      ['Review response rate', 20, 'Pass: 80%+ of all reviews have an owner response', 'binary'],
      ['Review response speed', 10, 'Pass: average response within 48 hours', 'binary'],
      ['Review recency', 15, 'Pass: at least 1 new review in the last 90 days', 'binary'],
      ['Review-generation system in place', 10, 'Repeatable process for requesting reviews, not left to chance', 'binary'],
      ['Secondary platform presence', 5, 'Yelp/Facebook, if relevant to business type', 'binary'],
    ]
  },
  {
    key: 'local', name: 'Local Search & Competitive Visibility', weight: 0.15, color: '#6FCF97',
    criteria: [
      ['Map pack ranking — primary term', 25, 'Pass: appears in the top 3 Google Maps results for "[service] near [city]"', 'binary'],
      ['Map pack ranking — variant terms', 15, 'Pass: top 3–5 for at least 2 of 3 related search phrases', 'binary'],
      ['Organic web visibility', 15, 'Pass: business site appears on page 1 for branded + service+city searches', 'binary'],
      ['Citation consistency', 20, 'Pass: NAP matches across 3+ major directories (Yelp, Facebook, BBB, Angi)', 'binary'],
      ['Review volume vs. competitors', 15, 'Pass: review count at or above the median of 3-5 benchmarked competitors', 'binary'],
      ['Rating vs. competitors', 10, 'Pass: star rating at or above the median of benchmarked competitors', 'binary'],
    ]
  },
  {
    key: 'website', name: 'Website Presence & Consistency', weight: 0.25, color: '#B98BD9',
    criteria: [
      ['NAP consistency with GBP', 20, 'Name/Address/Phone must match exactly', 'binary'],
      ['Mobile usability', 15, 'Pass: loads correctly, readable, fully usable on a phone', 'binary'],
      ['Services clearly listed', 10, 'Pass: a visitor understands the offering within 10 seconds', 'binary'],
      ['Contact/CTA prominence', 15, 'Pass: click-to-call or contact form visible above the fold', 'binary'],
      ['Reviews/testimonials on site', 10, 'Any social proof displayed', 'binary'],
      ['Photos current & authentic', 10, 'Pass: real, current business photos, not stock imagery', 'binary'],
      ['Basic SEO hygiene', 10, 'Pass: page title, meta description, and local terms present', 'binary'],
      ['Site functions without errors', 10, 'No broken links or bugs', 'binary'],
    ]
  }
];

const state = {};
PILLARS.forEach(p => state[p.key] = p.criteria.map(() => 0));

function pillarSubtotal(p) {
  return state[p.key].reduce((a,b) => a + (b === null ? 0 : b), 0);
}
function pillarMax(p) {
  return p.criteria.reduce((a,c,idx) => a + (state[p.key][idx] === null ? 0 : c[1]), 0);
}
function composite() {
  return PILLARS.reduce((sum, p) => {
    const max = pillarMax(p);
    const pct = max === 0 ? 0 : (pillarSubtotal(p) / max * 100);
    return sum + pct * p.weight;
  }, 0);
}
function interpretation(score) {
  if (score < 41) return { label: 'Critical', color: '#EF7F7F' };
  if (score < 61) return { label: 'Needs Work', color: '#E8B85B' };
  if (score < 81) return { label: 'Solid', color: '#5B7FE0' };
  return { label: 'Excellent', color: '#6FCF97' };
}

function render() {
  const rowsEl = document.getElementById('pillarRows');
  rowsEl.innerHTML = PILLARS.map(p => {
    const sub = pillarSubtotal(p);
    const max = pillarMax(p);
    const pct = (sub/max*100);
    const contrib = (pct * p.weight).toFixed(1);
    return `
      <div class="pillar-row">
        <div>
          <div class="pname">${p.name}</div>
          <div class="pweight">${(p.weight*100).toFixed(0)}% weight</div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${p.color}"></div></div>
        <div class="pscore">${pct.toFixed(0)}/100</div>
        <div class="pcontrib">+${contrib}</div>
      </div>`;
  }).join('');

  const score = composite();
  document.getElementById('compositeScore').textContent = score.toFixed(1);
  const interp = interpretation(score);
  const labelEl = document.getElementById('interpLabel');
  labelEl.textContent = interp.label;
  labelEl.style.color = interp.color;

  const arc = document.getElementById('gaugeArc');
  const circumference = 345.6;
  const offset = circumference - (score/100 * circumference);
  arc.style.strokeDashoffset = offset;
  arc.setAttribute('stroke', interp.color);

  renderPriorities();
  renderCompareStrip(score);
}

function renderPriorities() {
  const gaps = [];
  PILLARS.forEach(p => {
    p.criteria.forEach((c, ci) => {
      const scored = state[p.key][ci];
      if (scored === null) return;
      const max = c[1];
      const gap = max - scored;
      if (gap > 0) {
        gaps.push({ pillar: p.name, name: c[0], gap, max, scored });
      }
    });
  });
  gaps.sort((a, b) => b.gap - a.gap);
  const top5 = gaps.slice(0, 5);

  const listEl = document.getElementById('priorityList');
  if (top5.length === 0) {
    listEl.innerHTML = '<div class="priority-empty">Score every criterion to see your top priorities here.</div>';
    return;
  }
  listEl.innerHTML = top5.map((item, i) => `
    <div class="priority-item">
      <div class="priority-rank">${i + 1}</div>
      <div class="ptext">
        <div class="pname">${item.name}</div>
        <div class="ppillar">${item.pillar}</div>
      </div>
      <div class="pgap">${item.scored}/${item.max} — ${item.gap} pts open</div>
    </div>
  `).join('');
}

let previousAudit = null;

function renderCompareStrip(currentScore) {
  const strip = document.getElementById('compareStrip');
  if (!previousAudit) {
    strip.classList.remove('show');
    strip.innerHTML = '';
    return;
  }
  const delta = currentScore - previousAudit.score;
  const deltaClass = delta > 0.05 ? 'delta-up' : delta < -0.05 ? 'delta-down' : 'delta-flat';
  const deltaSign = delta > 0 ? '+' : '';
  strip.classList.add('show');
  strip.innerHTML = `
    <span>PREVIOUS (${previousAudit.date || 'undated'}): <strong style="color:var(--cream)">${previousAudit.score.toFixed(1)}</strong></span>
    <span>→</span>
    <span>CURRENT: <strong style="color:var(--cream)">${currentScore.toFixed(1)}</strong></span>
    <span class="${deltaClass}">(${deltaSign}${delta.toFixed(1)})</span>
  `;
}

function saveAudit() {
  const payload = {
    clientName: document.getElementById('clientName').value || 'Unnamed Client',
    auditDate: document.getElementById('auditDate').value || '',
    score: composite(),
    state: state,
    savedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = payload.clientName.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
  a.href = url;
  a.download = `audit-${safeName}-${payload.auditDate || 'undated'}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function loadAudit(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      previousAudit = { score: data.score, date: data.auditDate };

      document.getElementById('clientName').value = data.clientName || '';
      document.getElementById('auditDate').value = data.auditDate || '';

      PILLARS.forEach(p => {
        if (data.state && data.state[p.key]) {
          p.criteria.forEach((c, ci) => {
            const raw = data.state[p.key][ci];
            const isBinary = c[3] === 'binary';
            if (isBinary) {
              const mode = raw === null ? 'na' : (raw >= c[1] ? 'pass' : 'fail');
              setBinaryValue(p.key, ci, mode);
            } else {
              setCriterionValue(p.key, ci, raw ?? 0, c[1]);
            }
          });
        }
      });
      render();
    } catch (err) {
      alert('Could not read that file — make sure it\'s a JSON file saved from this tool.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function buildCards() {
  const container = document.getElementById('pillarCards');
  container.innerHTML = PILLARS.map((p, pi) => `
    <div class="pillar-card" id="card-${p.key}">
      <div class="pillar-card-header" onclick="toggleCard('${p.key}')">
        <div class="title-block">
          <h3>${p.name}</h3>
          <span class="weight-tag">${(p.weight*100).toFixed(0)}%</span>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
          <span class="subtotal" id="subtotal-${p.key}">0/${pillarMax(p)}</span>
          <span class="chevron">⌄</span>
        </div>
      </div>
      <div class="criteria-list" id="list-${p.key}">
        <div class="criteria-list-inner">
          ${p.criteria.map((c, ci) => {
            const isBinary = c[3] === 'binary';
            if (isBinary) {
              return `
            <div class="criterion binary">
              <div>
                <div class="cname">${c[0]}</div>
                <span class="cnote">${c[2]}</span>
              </div>
              <div class="toggle-group" id="toggle-${p.key}-${ci}">
                <button type="button" class="toggle-btn is-fail" onclick="setBinaryValue('${p.key}', ${ci}, 'fail')">Fail</button>
                <button type="button" class="toggle-btn is-pass" onclick="setBinaryValue('${p.key}', ${ci}, 'pass')">Pass</button>
                <button type="button" class="toggle-btn is-na" onclick="setBinaryValue('${p.key}', ${ci}, 'na')">N/A</button>
              </div>
              <div class="criterion-points">${c[1]} pt${c[1] > 1 ? 's' : ''}</div>
            </div>`;
            }
            return `
            <div class="criterion">
              <div>
                <div class="cname">${c[0]}</div>
                <span class="cnote">${c[2]}</span>
              </div>
              <input type="range" id="slider-${p.key}-${ci}" min="0" max="${c[1]}" value="0" step="1"
                oninput="updateCriterion('${p.key}', ${ci}, this.value)">
              <div class="cval">
                <input type="number" id="num-${p.key}-${ci}" min="0" max="${c[1]}" value="0"
                  onchange="updateFromNumber('${p.key}', ${ci}, this.value)">
                <span class="max">/ ${c[1]}</span>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
  `).join('');
}

function toggleCard(key) {
  const card = document.getElementById(`card-${key}`);
  const list = document.getElementById(`list-${key}`);
  const isOpen = card.classList.contains('open');
  if (isOpen) {
    card.classList.remove('open');
    list.style.maxHeight = null;
  } else {
    card.classList.add('open');
    list.style.maxHeight = list.scrollHeight + 'px';
  }
}

function setCriterionValue(key, idx, rawVal, maxVal) {
  let val = Math.round(parseFloat(rawVal));
  if (isNaN(val)) val = 0;
  val = Math.max(0, Math.min(maxVal, val));
  state[key][idx] = val;
  const p = PILLARS.find(p => p.key === key);
  const isBinary = p.criteria[idx][3] === 'binary';
  if (isBinary) {
    updateToggleVisual(key, idx);
  } else {
    document.getElementById(`slider-${key}-${idx}`).value = val;
    document.getElementById(`num-${key}-${idx}`).value = val;
  }
  document.getElementById(`subtotal-${key}`).textContent = `${pillarSubtotal(p)}/${pillarMax(p)}`;
  const list = document.getElementById(`list-${key}`);
  if (list.style.maxHeight) list.style.maxHeight = list.scrollHeight + 'px';
  render();
}

function setBinaryValue(key, idx, mode) {
  const p = PILLARS.find(p => p.key === key);
  const maxVal = p.criteria[idx][1];
  state[key][idx] = mode === 'pass' ? maxVal : mode === 'fail' ? 0 : null;
  updateToggleVisual(key, idx);
  document.getElementById(`subtotal-${key}`).textContent = `${pillarSubtotal(p)}/${pillarMax(p)}`;
  const list = document.getElementById(`list-${key}`);
  if (list.style.maxHeight) list.style.maxHeight = list.scrollHeight + 'px';
  render();
}

function updateToggleVisual(key, idx) {
  const p = PILLARS.find(p => p.key === key);
  const maxVal = p.criteria[idx][1];
  const val = state[key][idx];
  const group = document.getElementById(`toggle-${key}-${idx}`);
  if (!group) return;
  const failBtn = group.querySelector('.is-fail');
  const passBtn = group.querySelector('.is-pass');
  const naBtn = group.querySelector('.is-na');
  failBtn.classList.toggle('active', val === 0);
  passBtn.classList.toggle('active', val === maxVal);
  naBtn.classList.toggle('active', val === null);
}

function updateCriterion(key, idx, val) {
  const p = PILLARS.find(p => p.key === key);
  setCriterionValue(key, idx, val, p.criteria[idx][1]);
}

function updateFromNumber(key, idx, val) {
  const p = PILLARS.find(p => p.key === key);
  setCriterionValue(key, idx, val, p.criteria[idx][1]);
}

function esc(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function buildPrintDocument() {
  const name = document.getElementById('clientName').value.trim() || 'Unnamed Client';
  const dateVal = document.getElementById('auditDate').value;
  const dateDisplay = dateVal
    ? new Date(dateVal + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
    : new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  const score = composite();
  const interp = interpretation(score);

  // ---- Cover page ----
  const logoSrc = document.querySelector('header img').src;
  const cover = `
    <section class="pd-page pd-cover">
      <div class="pd-cover-top">
        <img src="${logoSrc}" class="pd-cover-logo" alt="">
        <div class="pd-cover-brand">MISSION: FOUND</div>
      </div>
      <div class="pd-cover-mid">
        <div class="pd-cover-eyebrow">Digital Visibility Audit Report</div>
        <div class="pd-cover-client">${esc(name)}</div>
        <div class="pd-cover-date">${dateDisplay}</div>
      </div>
      <div class="pd-cover-bottom">
        <div class="pd-cover-score">${score.toFixed(1)}/100 — ${interp.label}</div>
        <div class="pd-cover-footer">Prepared by Mission: Found &nbsp;·&nbsp; Confidential — for client use only</div>
      </div>
    </section>`;

  // ---- Executive summary page ----
  const pillarRows = PILLARS.map(p => {
    const sub = pillarSubtotal(p);
    const max = pillarMax(p);
    const pct = (sub / max * 100);
    return `
      <tr>
        <td class="pd-td-name">${esc(p.name)}</td>
        <td class="pd-td-center">${(p.weight * 100).toFixed(0)}%</td>
        <td class="pd-td-center">${pct.toFixed(0)}/100</td>
        <td class="pd-td-center pd-td-contrib">+${(pct * p.weight).toFixed(1)}</td>
      </tr>`;
  }).join('');

  const gaps = [];
  PILLARS.forEach(p => {
    p.criteria.forEach((c, ci) => {
      const scored = state[p.key][ci];
      if (scored === null) return;
      const gap = c[1] - scored;
      if (gap > 0) gaps.push({ pillar: p.name, name: c[0], gap, max: c[1] });
    });
  });
  gaps.sort((a, b) => b.gap - a.gap);
  const top5 = gaps.slice(0, 5);
  const priorityHtml = top5.length === 0
    ? '<div class="pd-empty">Every criterion has been scored — no open priorities remain.</div>'
    : top5.map((item, i) => `
      <div class="pd-priority-item">
        <div class="pd-priority-rank">${i + 1}</div>
        <div class="pd-priority-text">
          <div class="pd-priority-name">${esc(item.name)}</div>
          <div class="pd-priority-pillar">${esc(item.pillar)}</div>
        </div>
        <div class="pd-priority-gap">${item.gap} pt${item.gap > 1 ? 's' : ''} open</div>
      </div>`).join('');

  const execSummary = `
    <section class="pd-page">
      <div class="pd-section-header">Executive Summary</div>
      <div class="pd-score-block">
        <div class="pd-score-num">${score.toFixed(1)}<span class="pd-score-max">/100</span></div>
        <div class="pd-score-label" style="color:${interp.color}">${interp.label}</div>
      </div>
      <div class="pd-methodology">
        Digital Visibility Score is a weighted assessment across four pillars: Google Business Profile
        Optimization (35%), Reviews &amp; Reputation (25%), Local Search &amp; Competitive Visibility (15%),
        and Website Presence &amp; Consistency (25%). Each criterion is scored Pass/Fail against a defined
        standard, then rolled up into a single composite score.
      </div>
      <table class="pd-table">
        <thead><tr><th>Pillar</th><th class="pd-th-center">Weight</th><th class="pd-th-center">Score</th><th class="pd-th-center">Contribution</th></tr></thead>
        <tbody>${pillarRows}</tbody>
      </table>
      <div class="pd-subhead">Top Priorities</div>
      <div class="pd-priority-sub">Ranked by point opportunity — fix these first.</div>
      ${priorityHtml}
    </section>`;

  // ---- Pillar detail pages ----
  const pillarPages = PILLARS.map(p => {
    const rows = p.criteria.map((c, ci) => {
      const scored = state[p.key][ci];
      const isNA = scored === null;
      const passed = !isNA && scored >= c[1];
      const badgeClass = isNA ? 'pd-badge-na' : (passed ? 'pd-badge-pass' : 'pd-badge-fail');
      const badgeText = isNA ? 'N/A' : (passed ? 'Pass' : 'Fail');
      return `
        <tr>
          <td class="pd-td-crit">
            <div class="pd-crit-name">${esc(c[0])}</div>
            <div class="pd-crit-note">${esc(c[2])}</div>
          </td>
          <td class="pd-td-center"><span class="pd-badge ${badgeClass}">${badgeText}</span></td>
        </tr>`;
    }).join('');

    const sub = pillarSubtotal(p);
    const max = pillarMax(p);

    return `
      <section class="pd-page">
        <div class="pd-pillar-header">
          <div class="pd-pillar-title">${esc(p.name)}</div>
          <div class="pd-pillar-meta">${(p.weight * 100).toFixed(0)}% weight &nbsp;·&nbsp; ${sub}/${max} points</div>
        </div>
        <table class="pd-table">
          <thead><tr><th>Criterion</th><th class="pd-th-center">Result</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </section>`;
  }).join('');

  document.getElementById('printDoc').innerHTML = cover + execSummary + pillarPages;
}

window.addEventListener('beforeprint', buildPrintDocument);

buildCards();
render();
// Open first card by default
toggleCard(PILLARS[0].key);
</script>

</body>
</html>
