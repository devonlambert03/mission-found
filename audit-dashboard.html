<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Visibility Score — Mission: Found</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');

  :root {
    --cream: #F4EFE6; --navy: #0E1730; --navy-deep: #060A16;
    --blue: #5B7FE0; --muted: #B3C0DE; --card: #10192F;
    --red: #EF7F7F; --amber: #E8B85B; --green: #6FCF97;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Space Grotesk', sans-serif; background: var(--navy-deep);
    color: var(--cream); padding: 40px 24px 80px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }

  header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 36px; flex-wrap: wrap; gap: 20px; }
  .logo { display: flex; flex-direction: column; line-height: 0.9; font-family: 'JetBrains Mono', monospace; }
  .logo .l1 { font-weight: 600; font-size: 20px; letter-spacing: 0.02em; color: var(--cream); }
  .logo .l2 { font-weight: 600; font-size: 20px; letter-spacing: 0.06em; color: transparent; -webkit-text-stroke: 1.2px var(--blue); margin-left: 1ch; }
  .tool-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

  .meta-inputs { display: flex; gap: 12px; flex-wrap: wrap; }
  .meta-field label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  .meta-field input {
    background: var(--card); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
    padding: 9px 12px; color: var(--cream); font-family: 'Space Grotesk', sans-serif; font-size: 13px; outline: none;
  }
  .meta-field input:focus { border-color: var(--blue); }

  .score-panel {
    display: grid; grid-template-columns: 280px 1fr; gap: 32px; align-items: center;
    background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px;
    padding: 36px; margin-bottom: 40px;
  }
  .gauge-wrap { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .gauge-svg-wrap { position: relative; width: 260px; height: 150px; }
  .gauge-svg-wrap svg { display: block; }
  .gauge-num {
    position: absolute; left: 0; right: 0; bottom: 4px; text-align: center;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px;
  }
  .gauge-num .big { font-size: 44px; display: block; line-height: 1; }
  .gauge-num .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 6px; display: block; }

  .breakdown h2 { font-size: 15px; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-bottom: 18px; font-weight: 600; }
  .pillar-row { display: grid; grid-template-columns: 190px 1fr 60px 50px; align-items: center; gap: 14px; margin-bottom: 14px; }
  .pillar-row .pname { font-size: 13.5px; font-weight: 600; }
  .pillar-row .pweight { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); }
  .bar-track { height: 8px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width 0.25s ease, background 0.25s ease; }
  .pscore { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; text-align: right; }
  .pcontrib { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--muted); text-align: right; }

  .pillar-card {
    background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px;
    margin-bottom: 20px; overflow: hidden;
  }
  .pillar-card-header {
    display: flex; justify-content: space-between; align-items: center; padding: 20px 26px;
    cursor: pointer; user-select: none;
  }
  .pillar-card-header .title-block { display: flex; align-items: center; gap: 14px; }
  .pillar-card-header h3 { font-size: 17px; font-weight: 700; }
  .pillar-card-header .weight-tag {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.04em;
    color: var(--blue); border: 1px solid var(--blue); border-radius: 999px; padding: 3px 10px;
  }
  .pillar-card-header .subtotal { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; color: var(--muted); }
  .chevron { transition: transform 0.2s; color: var(--muted); }
  .pillar-card.open .chevron { transform: rotate(180deg); }

  .criteria-list { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
  .criteria-list-inner { padding: 6px 26px 24px; display: flex; flex-direction: column; gap: 20px; }
  .criterion { display: grid; grid-template-columns: 1fr 120px 70px; align-items: center; gap: 16px; }
  .criterion .cname { font-size: 15px; font-weight: 500; color: var(--cream); line-height: 1.4; }
  .criterion .cnote { display: block; font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .criterion input[type=range] {
    -webkit-appearance: none; width: 100%; height: 6px; border-radius: 999px;
    background: rgba(255,255,255,0.1); outline: none;
  }
  .criterion input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--blue); cursor: pointer; border: 2px solid var(--cream);
  }
  .criterion .cval { display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
  .criterion .cval input[type=number] {
    width: 34px; background: transparent; border: 1px solid transparent; border-radius: 6px;
    padding: 4px 2px; color: var(--cream); font-family: 'JetBrains Mono', monospace; font-size: 13px;
    font-weight: 600; text-align: center; outline: none; transition: border-color 0.15s, background 0.15s;
    -moz-appearance: textfield;
  }
  .criterion .cval input[type=number]::-webkit-outer-spin-button,
  .criterion .cval input[type=number]::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .criterion .cval input[type=number]:hover { background: rgba(255,255,255,0.05); }
  .criterion .cval input[type=number]:focus { border-color: var(--blue); background: var(--navy); }
  .criterion .cval .max { color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }

  .interp-legend { display: flex; gap: 14px 18px; flex-wrap: wrap; justify-content: center; margin-top: 14px; max-width: 260px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); }
  .interp-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .interp-legend .dot { width: 8px; height: 8px; border-radius: 50%; }

  .print-btn {
    display: inline-flex; align-items: center; gap: 8px; background: var(--cream); color: var(--navy-deep);
    font-weight: 600; font-size: 14px; padding: 12px 22px; border-radius: 999px; border: none;
    cursor: pointer; font-family: 'Space Grotesk', sans-serif; margin-top: 8px;
  }

  @media print {
    :root {
      --cream: #1A1A1A; --navy: #F2F2F2; --navy-deep: #FFFFFF;
      --card: #F7F7F7; --muted: #555555; --blue: #3355B0;
    }
    body { background: white; padding: 10px; }
    .score-panel, .pillar-card {
      border: 1px solid #DDDDDD !important; box-shadow: none !important;
    }
    .bar-track, .criterion input[type=range] { background: #E2E2E2 !important; }
    .meta-field input, .criterion .cval input[type=number] {
      background: #FFFFFF !important; border: 1px solid #CCCCCC !important; color: #1A1A1A !important;
    }
    svg path[stroke="rgba(255,255,255,0.08)"] { stroke: #E2E2E2 !important; }
    .criterion input[type=range] { display: none; }
    .criterion { grid-template-columns: 1fr 60px !important; }
    .criteria-list { max-height: none !important; }
    .chevron, .print-btn { display: none; }
  }

  @media (max-width: 760px) {
    .score-panel { grid-template-columns: 1fr; text-align: center; }
    .pillar-row { grid-template-columns: 1fr; text-align: left; gap: 6px; }
    .pillar-row .bar-track { grid-column: 1 / -1; }
    .criterion { grid-template-columns: 1fr; gap: 8px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <div class="logo"><span class="l1">MISSION:</span><span class="l2">FOUND</span></div>
    </div>
    <div class="meta-inputs">
      <div class="meta-field"><label>Client Name</label><input type="text" id="clientName"></div>
      <div class="meta-field"><label>Audit Date</label><input type="date" id="auditDate"></div>
    </div>
  </header>

  <div class="score-panel">
    <div class="gauge-wrap">
      <div class="gauge-svg-wrap">
        <svg width="260" height="150" viewBox="0 0 260 150">
          <path d="M 20 140 A 110 110 0 0 1 240 140" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="20" stroke-linecap="round"/>
          <path id="gaugeArc" d="M 20 140 A 110 110 0 0 1 240 140" fill="none" stroke="#EF7F7F" stroke-width="20" stroke-linecap="round" stroke-dasharray="345.6" stroke-dashoffset="345.6"/>
        </svg>
        <div class="gauge-num">
          <span class="big" id="compositeScore">0.0</span>
          <span class="label" id="interpLabel">Critical</span>
        </div>
      </div>
      <div class="interp-legend">
        <span><span class="dot" style="background:#EF7F7F"></span>0–40 Critical</span>
        <span><span class="dot" style="background:#E8B85B"></span>41–60 Needs Work</span>
        <span><span class="dot" style="background:#5B7FE0"></span>61–80 Solid</span>
        <span><span class="dot" style="background:#6FCF97"></span>81–100 Excellent</span>
      </div>
    </div>
    <div class="breakdown">
      <h2>Pillar Breakdown</h2>
      <div id="pillarRows"></div>
      <button class="print-btn" onclick="window.print()">🖨 Print / Save as PDF</button>
    </div>
  </div>

  <div id="pillarCards"></div>
</div>

<script>
const PILLARS = [
  {
    key: 'gbp', name: 'Google Business Profile Optimization', weight: 0.35, color: '#5B7FE0',
    criteria: [
      ['Business info accuracy (name/address/phone)', 20, 'Exact match across GBP and every listing'],
      ['Primary + secondary categories', 10, 'Most specific accurate primary category'],
      ['Business description quality', 10, 'Present, keyword-relevant, full length'],
      ['Hours of operation accuracy', 5, 'Includes holiday hours if applicable'],
      ['Services/products list completeness', 10, 'Complete, specific, not just defaults'],
      ['Service area configuration', 5, 'If the business travels to customers'],
      ['Attributes completed', 5, 'Accessibility, payment types, etc.'],
      ['Photos — quantity & recency', 15, '10+ photos, 3+ in last 90 days'],
      ['Google Posts activity', 10, '2+ posts in last 30 days'],
      ['Q&A monitored', 5, 'No unanswered questions older than 7 days'],
      ['Messaging/booking enabled', 5, 'If supported for business type'],
    ]
  },
  {
    key: 'reviews', name: 'Reviews & Reputation', weight: 0.25, color: '#E8B85B',
    criteria: [
      ['Review count vs. competitor average', 20, 'Compare to 3-5 benchmarked competitors'],
      ['Average star rating', 20, 'Weighted toward recent reviews'],
      ['Review response rate', 20, '% of all reviews with owner response'],
      ['Review response speed', 10, 'Avg turnaround, last 10 reviews'],
      ['Review recency', 15, 'Reviews received in last 90 days'],
      ['Review-generation system in place', 10, 'Repeatable process for requesting reviews, not left to chance'],
      ['Secondary platform presence', 5, 'Yelp/Facebook, if relevant to business type'],
    ]
  },
  {
    key: 'local', name: 'Local Search & Competitive Visibility', weight: 0.15, color: '#6FCF97',
    criteria: [
      ['Search impressions / discovery searches', 20, 'From GBP Insights'],
      ['Maps views', 15, 'From GBP Insights'],
      ['Ranking spot-check', 20, 'Search 3-5 realistic customer terms + location, note position'],
      ['Website clicks from profile', 15, 'From GBP Insights'],
      ['Direction requests', 10, 'From GBP Insights'],
      ['Phone calls from listing', 10, 'From GBP Insights, if tracked'],
      ['Competitive position', 10, 'Standing relative to the 3-5 benchmarked competitors'],
    ]
  },
  {
    key: 'website', name: 'Website Presence & Consistency', weight: 0.25, color: '#B98BD9',
    criteria: [
      ['NAP consistency with GBP', 20, 'Name/Address/Phone must match exactly'],
      ['Mobile usability', 15, 'Loads correctly, readable, tappable'],
      ['Services clearly listed', 10, 'A visitor understands the offering within 10 seconds'],
      ['Contact/CTA prominence', 15, 'Click-to-call, contact form above fold'],
      ['Reviews/testimonials on site', 10, 'Any social proof displayed'],
      ['Photos current & authentic', 10, 'Real business photos, not stock'],
      ['Basic SEO hygiene', 10, 'Page title, meta description, local terms'],
      ['Site functions without errors', 10, 'No broken links or bugs'],
    ]
  }
];

const state = {};
PILLARS.forEach(p => state[p.key] = p.criteria.map(() => 0));

function pillarSubtotal(p) {
  return state[p.key].reduce((a,b) => a+b, 0);
}
function pillarMax(p) {
  return p.criteria.reduce((a,c) => a+c[1], 0);
}
function composite() {
  return PILLARS.reduce((sum, p) => sum + (pillarSubtotal(p) / pillarMax(p) * 100) * p.weight, 0);
}
function interpretation(score) {
  if (score < 41) return { label: 'Critical', color: '#EF7F7F' };
  if (score < 61) return { label: 'Needs Work', color: '#E8B85B' };
  if (score < 81) return { label: 'Solid', color: '#5B7FE0' };
  return { label: 'Excellent', color: '#6FCF97' };
}

function render() {
  const rowsEl = document.getElementById('pillarRows');
  rowsEl.innerHTML = PILLARS.map(p => {
    const sub = pillarSubtotal(p);
    const max = pillarMax(p);
    const pct = (sub/max*100);
    const contrib = (pct * p.weight).toFixed(1);
    return `
      <div class="pillar-row">
        <div>
          <div class="pname">${p.name}</div>
          <div class="pweight">${(p.weight*100).toFixed(0)}% weight</div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${p.color}"></div></div>
        <div class="pscore">${pct.toFixed(0)}/100</div>
        <div class="pcontrib">+${contrib}</div>
      </div>`;
  }).join('');

  const score = composite();
  document.getElementById('compositeScore').textContent = score.toFixed(1);
  const interp = interpretation(score);
  const labelEl = document.getElementById('interpLabel');
  labelEl.textContent = interp.label;
  labelEl.style.color = interp.color;

  const arc = document.getElementById('gaugeArc');
  const circumference = 345.6;
  const offset = circumference - (score/100 * circumference);
  arc.style.strokeDashoffset = offset;
  arc.setAttribute('stroke', interp.color);
}

function buildCards() {
  const container = document.getElementById('pillarCards');
  container.innerHTML = PILLARS.map((p, pi) => `
    <div class="pillar-card" id="card-${p.key}">
      <div class="pillar-card-header" onclick="toggleCard('${p.key}')">
        <div class="title-block">
          <h3>${p.name}</h3>
          <span class="weight-tag">${(p.weight*100).toFixed(0)}%</span>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
          <span class="subtotal" id="subtotal-${p.key}">0/${pillarMax(p)}</span>
          <span class="chevron">⌄</span>
        </div>
      </div>
      <div class="criteria-list" id="list-${p.key}">
        <div class="criteria-list-inner">
          ${p.criteria.map((c, ci) => `
            <div class="criterion">
              <div>
                <div class="cname">${c[0]}</div>
                <span class="cnote">${c[2]}</span>
              </div>
              <input type="range" id="slider-${p.key}-${ci}" min="0" max="${c[1]}" value="0" step="1"
                oninput="updateCriterion('${p.key}', ${ci}, this.value)">
              <div class="cval">
                <input type="number" id="num-${p.key}-${ci}" min="0" max="${c[1]}" value="0"
                  onchange="updateFromNumber('${p.key}', ${ci}, this.value)">
                <span class="max">/ ${c[1]}</span>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `).join('');
}

function toggleCard(key) {
  const card = document.getElementById(`card-${key}`);
  const list = document.getElementById(`list-${key}`);
  const isOpen = card.classList.contains('open');
  if (isOpen) {
    card.classList.remove('open');
    list.style.maxHeight = null;
  } else {
    card.classList.add('open');
    list.style.maxHeight = list.scrollHeight + 'px';
  }
}

function setCriterionValue(key, idx, rawVal, maxVal) {
  let val = Math.round(parseFloat(rawVal));
  if (isNaN(val)) val = 0;
  val = Math.max(0, Math.min(maxVal, val));
  state[key][idx] = val;
  document.getElementById(`slider-${key}-${idx}`).value = val;
  document.getElementById(`num-${key}-${idx}`).value = val;
  const p = PILLARS.find(p => p.key === key);
  document.getElementById(`subtotal-${key}`).textContent = `${pillarSubtotal(p)}/${pillarMax(p)}`;
  const list = document.getElementById(`list-${key}`);
  if (list.style.maxHeight) list.style.maxHeight = list.scrollHeight + 'px';
  render();
}

function updateCriterion(key, idx, val) {
  const p = PILLARS.find(p => p.key === key);
  setCriterionValue(key, idx, val, p.criteria[idx][1]);
}

function updateFromNumber(key, idx, val) {
  const p = PILLARS.find(p => p.key === key);
  setCriterionValue(key, idx, val, p.criteria[idx][1]);
}

buildCards();
render();
// Open first card by default
toggleCard(PILLARS[0].key);
</script>

</body>
</html>
